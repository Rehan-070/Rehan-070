<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Rehan's developer workspace</title>
<desc id="desc">A dark emerald developer dashboard showing Python backend code, an AI workflow and technology stack.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101713"/>
    <stop offset="1" stop-color="#080D0A"/>
  </linearGradient>

  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C853"/>
    <stop offset="1" stop-color="#69F0AE"/>
  </linearGradient>

  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#244332" stroke-width="1" opacity=".35"/>
  </pattern>

  <filter id="soft">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<!-- Background -->
<rect x="2" y="2" width="996" height="466" rx="22"
      fill="url(#bg)" stroke="#28543A" stroke-width="2"/>

<rect x="3" y="3" width="994" height="464" rx="21"
      fill="url(#grid)" opacity=".65"/>

<circle cx="820" cy="90" r="110" fill="#00C853"
        opacity=".12" filter="url(#soft)"/>

<circle cx="160" cy="390" r="100" fill="#16A34A"
        opacity=".10" filter="url(#soft)"/>

<!-- Top bar -->
<path d="M3 62H997" stroke="#28543A"/>

<circle cx="30" cy="32" r="7" fill="#FF6B6B"/>
<circle cx="54" cy="32" r="7" fill="#FBBF24"/>
<circle cx="78" cy="32" r="7" fill="#00C853"/>

<text x="112" y="38" fill="#A7B8AA"
      font-family="monospace" font-size="16">
  rehan@developer-workspace
</text>

<text x="900" y="38" fill="#69F0AE"
      font-family="monospace" font-size="13" text-anchor="end">
  ● ONLINE
</text>

<!-- Code editor -->
<rect x="28" y="88" width="560" height="335" rx="14"
      fill="#0C1510" stroke="#28543A"/>

<text x="52" y="119" fill="#DCE9DF"
      font-family="monospace" font-size="16">
  backend / api.py
</text>

<circle cx="542" cy="112" r="4" fill="#00C853"/>
<path d="M48 137H568" stroke="#284333"/>

<g font-family="monospace" font-size="15">
  <text x="52" y="174" fill="#668B72">01</text>
  <text x="88" y="174" fill="#69F0AE">from</text>
  <text x="132" y="174" fill="#DCE9DF"> django.http </text>
  <text x="248" y="174" fill="#69F0AE">import</text>
  <text x="302" y="174" fill="#A5D6A7"> JsonResponse</text>

  <text x="52" y="207" fill="#668B72">02</text>
  <text x="88" y="207" fill="#69F0AE">def</text>
  <text x="122" y="207" fill="#A5D6A7"> health_check</text>
  <text x="244" y="207" fill="#DCE9DF">(request):</text>

  <text x="52" y="240" fill="#668B72">03</text>
  <text x="108" y="240" fill="#69F0AE">return</text>
  <text x="164" y="240" fill="#A5D6A7"> JsonResponse</text>
  <text x="278" y="240" fill="#DCE9DF">({</text>
  <text x="292" y="240" fill="#B9F6CA">'status'</text>
  <text x="361" y="240" fill="#DCE9DF">: </text>
  <text x="375" y="240" fill="#B9F6CA">'healthy'</text>
  <text x="449" y="240" fill="#DCE9DF">})</text>

  <text x="52" y="290" fill="#668B72">04</text>
  <text x="88" y="290" fill="#668B72"># Build. Test. Improve.</text>

  <text x="52" y="350" fill="#00C853">➜</text>
  <text x="88" y="350" fill="#DCE9DF">python manage.py runserver</text>

  <text x="52" y="383" fill="#69F0AE">✓ API server ready</text>
</g>

<!-- AI / ML workflow -->
<rect x="612" y="88" width="360" height="188" rx="14"
      fill="#0C1510" stroke="#28543A"/>

<text x="638" y="120" fill="#DCE9DF"
      font-family="monospace" font-size="16">
  AI / ML WORKFLOW
</text>

<g stroke="#00C853" stroke-width="2" fill="none" opacity=".9">
  <path d="M685 185L758 157L834 185L900 148
           M758 157L790 230L900 148
           M685 185L790 230L834 185"/>
</g>

<g fill="#123522" stroke="#00C853" stroke-width="2">
  <circle cx="685" cy="185" r="19"/>
  <circle cx="758" cy="157" r="19"/>
  <circle cx="834" cy="185" r="19"/>
  <circle cx="900" cy="148" r="19"/>
  <circle cx="790" cy="230" r="19"/>
</g>

<g fill="#D8FCE5" font-family="monospace"
   font-size="11" text-anchor="middle">
  <text x="685" y="189">DATA</text>
  <text x="758" y="161">ML</text>
  <text x="834" y="189">API</text>
  <text x="900" y="152">AI</text>
  <text x="790" y="234">RAG</text>
</g>

<!-- Technology stack -->
<rect x="612" y="294" width="360" height="129" rx="14"
      fill="#0C1510" stroke="#28543A"/>

<text x="638" y="326" fill="#DCE9DF"
      font-family="monospace" font-size="16">
  CURRENT TOOLKIT
</text>

<g font-family="monospace" font-size="13">
  <rect x="638" y="346" width="92" height="27" rx="7"
        fill="#123522" stroke="#16803D"/>
  <text x="684" y="364" fill="#69F0AE" text-anchor="middle">Python</text>

  <rect x="740" y="346" width="92" height="27" rx="7"
        fill="#123522" stroke="#16803D"/>
  <text x="786" y="364" fill="#69F0AE" text-anchor="middle">Django</text>

  <rect x="842" y="346" width="104" height="27" rx="7"
        fill="#123522" stroke="#16803D"/>
  <text x="894" y="364" fill="#69F0AE" text-anchor="middle">AI / ML</text>

  <text x="638" y="399" fill="#91AA98">
    Backend engineering · Problem solving
  </text>
</g>

</svg>

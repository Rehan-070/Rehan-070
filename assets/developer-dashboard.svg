  <rect x="740" y="346" width="92" height="27" rx="7" fill="#102c40" stroke="#1c7894"/><text x="786" y="364" fill="#7dd3fc" text-anchor="middle">Django</text>
  <rect x="842" y="346" width="104" height="27" rx="7" fill="#102c40" stroke="#1c7894"/><text x="894" y="364" fill="#7dd3fc" text-anchor="middle">AI / ML</text>
  <text x="638" y="399" fill="#7692a8">Backend engineering · Problem solving</text>
